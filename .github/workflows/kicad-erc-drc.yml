name: KiCad ERC/DRC

on:
  pull_request:
    branches: [ main ]
    paths:
      - "hardware/**/*.kicad_sch"
      - "hardware/**/*.kicad_pcb"
      - "hardware/**/*.kicad_pro"
      - "hardware/Libraries/**"
      - "modules/**/*.kicad_sch"
      - "modules/**/*.kicad_pcb"
      - "modules/**/*.kicad_pro"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed design files
    runs-on: ubuntu-latest
    outputs:
      sch: ${{ steps.files.outputs.sch }}
      pcb: ${{ steps.files.outputs.pcb }}
      labels: ${{ toJson(github.event.pull_request.labels.*.name) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        # Full-PR diff: the gate for merging is that the PR as a whole is valid.
        # Schematic-only intent is expressed via the "schematic-only" label,
        # not by which files happened to change in the latest push.

      - name: Categorize
        id: files
        env:
          CHANGED_PR: ${{ steps.changed-files.outputs.all_changed_files }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DISPATCH" = "true" ]; then
            # manual run: tj-actions diffs only the last commit here, so diff
            # against main ourselves
            CHANGED=$(git diff --name-only origin/main...HEAD)
          else
            CHANGED="$CHANGED_PR"
          fi
          sch=""; pcb=""
          for f in $CHANGED; do
            case "$f" in
              *.kicad_sch) sch="$sch $f" ;;
              *.kicad_pcb) pcb="$pcb $f" ;;
            esac
          done
          echo "sch=$sch" >> "$GITHUB_OUTPUT"
          echo "pcb=$pcb" >> "$GITHUB_OUTPUT"

  erc:
    name: ERC (errors + warnings)
    needs: changes
    if: needs.changes.outputs.sch != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Run once per project hierarchy, only for sheets changed in this PR.
      # A changed subsheet resolves to the root sheet that references it.
      - name: Find changed root schematics
        env:
          CHANGED: ${{ needs.changes.outputs.sch }}
        run: |
          # map: referenced_name -> referencing sheet (subsheets live in the same dir)
          map=$(mktemp)
          while read -r f; do
            grep -oE '"[^"]+\.kicad_sch"' "$f" 2>/dev/null | tr -d '"' \
              | while read -r ref; do echo "$ref $f"; done >> "$map"
          done < <(find hardware modules \( -name .history -prune \) -o \( -name '*.kicad_sch' \))
          resolve() {
            local f="$1"
            local ref; ref=$(grep "^$(basename "$f") " "$map" | awk '{print $2}' | head -1)
            if [ -n "$ref" ] && [ "$ref" != "$f" ]; then resolve "$ref"; else echo "$f"; fi
          }
          roots=""
          for f in $CHANGED; do
            roots="$roots $(resolve "$f")"
          done
          echo "ROOTS=$(printf '%s\n' $roots | sort -u | tr '\n' ' ')" >> "$GITHUB_ENV"

      # --severity-all: errors AND warnings fail the job; project exclusions are
      # honored by default (no --severity-exclusions), so ignored items don't fail
      - name: Run ERC
        run: |
          for sch in ${ROOTS:-}; do
            echo "ERC: $sch"
            out="erc-$(echo "$sch" | tr '/' '-').json"
            docker run --rm -v "$PWD:/work" -w /work kicad/kicad:10.0 \
              kicad-cli sch erc --severity-all --exit-code-violations --format json --output "$out" "$sch" || true
          done

      # shortcut: kicad-cli can't resolve repeated sheet instances (kicad#24409),
      # so it flags different_unit_net across instances of the same sheet
      # (/Sector1/CLK_BUF vs /Sector3/CLK_BUF). The GUI resolves these fine.
      # Drop only that pattern; everything else still fails the job.
      # Upgrade: remove this step when KiCad ships the instance-resolution fix.
      - name: Filter known kicad-cli hierarchy bug
        run: |
          python3 - <<'EOF'
          import json, glob, re, sys
          bad = 0
          for f in glob.glob('erc-*.json'):
              d = json.load(open(f))
              for s in d.get('sheets', []):
                  kept = []
                  for v in s.get('violations', []):
                      desc = v.get('description', '')
                      m = re.match(r'Pin \S+ is connected to both /[^/]+/(\S+) and /[^/]+/\1$', desc)
                      if v.get('type') == 'different_unit_net' and m:
                          print(f"filtered (kicad#24409): {desc}")
                          continue
                      kept.append(v)
                      if v.get('severity') in ('error', 'warning'):
                          bad += 1
                  s['violations'] = kept
              json.dump(d, open(f, 'w'))
          print(f"{bad} remaining error/warning violations")
          sys.exit(1 if bad else 0)
          EOF

      - name: Upload ERC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-reports
          path: erc-*.json
          if-no-files-found: ignore

  drc:
    name: DRC (errors only)
    needs: changes
    # DRC runs when a .kicad_pcb changed in the latest push AND the PR is not
    # labeled "schematic-only" (manual override for schematic-sync PRs).
    # Label "hardware-full" is informative only; default behavior is full.
    if: needs.changes.outputs.pcb != '' && !contains(needs.changes.outputs.labels, 'schematic-only')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --severity-error: warnings are reported but don't fail; exclusions honored
      # by default, so ignored violations don't fail. Parity issues count as errors.
      - name: Run DRC
        env:
          CHANGED: ${{ needs.changes.outputs.pcb }}
        run: |
          status=0
          for pcb in $CHANGED; do
            echo "DRC: $pcb"
            out="drc-$(echo "$pcb" | tr '/' '-').json"
            docker run --rm -v "$PWD:/work" -w /work kicad/kicad:10.0 \
              kicad-cli pcb drc --severity-error --schematic-parity --exit-code-violations --format json --output "$out" "$pcb" || status=1
          done
          exit $status

      - name: Upload DRC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drc-reports
          path: drc-*.json
          if-no-files-found: ignore
